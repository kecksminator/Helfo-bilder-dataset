name: Synthetic OCR and HELFO benchmark checks
on:
  push:
    paths: ['benchmark/**', '.github/workflows/synthetic-benchmark.yml']
  pull_request:
    paths: ['benchmark/**', '.github/workflows/synthetic-benchmark.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify dataset and evaluator
        working-directory: benchmark
        run: |
          python src/validate_dataset.py
          python -m unittest discover -s tests -v
          python src/evaluate.py --predictions outputs/baseline.jsonl --out-dir /tmp/benchmark-report --strict-coverage
